[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudprobe"
version = "0.1.0"
description = "Test whether a fraud-detection classifier can be fooled by AI-mutated transactions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Frank Fodjo Lontchi" }]
keywords = ["fraud-detection", "adversarial-machine-learning", "llm-security", "open-banking", "security-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "scipy>=1.10",
    "flask>=3.0",
]

[project.optional-dependencies]
full = ["xgboost>=2.0", "imbalanced-learn>=0.11", "matplotlib>=3.7"]
# SHAP powers the web dashboard's evasion explanations. It depends on numba, which
# lags new CPython releases, so it is kept separate from `full` to avoid breaking
# installs on the newest Python. Needs Python <3.14 at time of writing.
explain = ["shap>=0.44"]
llm = ["ollama>=0.1"]
dev = ["pytest>=8.0"]

[project.scripts]
fraudprobe = "fraudprobe.cli:main"

[project.urls]
Homepage = "https://github.com/YOURUSERNAME/fraudprobe"
Issues = "https://github.com/YOURUSERNAME/fraudprobe/issues"

[tool.setuptools.packages.find]
include = ["fraudprobe*"]

[tool.setuptools.package-data]
fraudprobe = ["templates/*.html"]
